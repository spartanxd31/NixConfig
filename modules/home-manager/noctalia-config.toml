[bar.default]
center = [ "notifications", "clock", "audio_visualizer", "control-center" ]
end = [ "caffeine", "bluetooth", "network", "volume", "brightness", "battery", "session" ]
margin_edge = 5.0
margin_ends = 10.0
start = [ "launcher", "bongocat", "media", "workspace_spacer", "workspaces", "spacer_system", "sysmon" ]

[desktop_widgets]
schema_version = 1
widget_order = [ "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    cx = 447.5999755859375
    cy = 786.63995361328125
    output = "eDP-1"
    rotation = 0.0
    scale = 2.559999942779541
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    cx = 172.0
    cy = 142.0
    output = "eDP-1"
    rotation = 0.0
    scale = 1.0
    type = "weather"

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

    [idle.behavior.suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = true
    timeout = 900

[location]
address = "Blacksburg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 1317.0
    output = "DP-4"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 1157.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
position = "top_left"

[osd]
position = "top_left"

[shell]
avatar_path = "/home/dom/.face"
font_family = "JetBrainsMono Nerd Font"
telemetry_enabled = true

[theme]
builtin = "Gruvbox"
community_palette = "GruvboxAlt"

[wallpaper]
directory = "/home/dom/Documents/NixConfig/Wallpapers"

    [wallpaper.default]
    path = "/home/dom/Documents/NixConfig/modules/home-manager/framework.jpg"

    [wallpaper.last]
    path = "/home/dom/Documents/NixConfig/modules/home-manager/framework.jpg"

[weather]
address = "Blacksburg "
unit = "imperial"

[widget.battery]
display_mode = "graphic"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.brightness]
show_label = false

[widget.control-center]
glyph = "brand-bilibili"

[widget.network]
show_label = false

[widget.spacer_system]
type = "spacer"

[widget.sysmon]
display = "gauge"
stat = "ram_used"

[widget.workspace_spacer]
capsule = true
type = "spacer"
