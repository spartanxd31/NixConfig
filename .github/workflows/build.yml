name: Build Home Manager Flake

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Home Manager Flake
        run: nix run nixpkgs#home-manager -- build --flake .#dom@nixos

      - name: Extract and Resolve Dotfiles
        run: |
          mkdir -p extracted-dotfiles
          cp -rL result/home-files/.config extracted-dotfiles/

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: dom-nixos-dotfiles
          path: extracted-dotfiles/
