name: Build Home Manager Flake

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Nix
        uses: cachix/install-nix-action@v15
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Home Manager Flake
        run:  nix run nixpkgs#home-manager -- build --flake .#dom@nixos

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: dom-nixos-dotfiles
          path: extracted-dotfiles/
